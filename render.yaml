# ==============================================================================
# Render Infrastructure as Code Blueprint (render.yaml)
# Connect your GitHub repo to Render and choose "Blueprint" to auto-deploy
# ==============================================================================
services:
  - type: web
    name: flour-erp-api
    runtime: node
    plan: free
    region: singapore # Closest free region to South Asia / Tokyo DB
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        value: flour-erp-jwt-secret-key-counter-shift-2026
      - key: CORS_ORIGIN
        sync: false
